# CI pipeline
name: CI

# Runs on every push to the main branch and every pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
# GitHub uses a fresh linux machien
# Runs all commands in /backend
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Temp Postgres & pgvector database for tests
    # Made when job starts, deleted when ends
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: repolens
          POSTGRES_PASSWORD: test
          POSTGRES_DB: repolens_test
        ports: ["5432:5432"]
        # Wait till database is ready before testing
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # How to connect to test database
    env:
      DATABASE_URL: postgresql://repolens:test@localhost:5432/repolens_test
    steps:
      - uses: actions/checkout@v4   # Download repo's code
      - uses: astral-sh/setup-uv@v5 # Install python package manager
      - run: uv sync                # Install Python dependencies
      - run: uv run ruff check .    # Check code style and bugs
      - run: uv run pytest          # Run the test suite

  
  # Front end, runs same time as backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  
  # Verifies the backend container was built successfully
  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t repolens-api ./backend